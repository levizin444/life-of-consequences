.pb.arm::before{background:linear-gradient(#ffb0bb 0 20%,#ff8a99 20% 60%,#e85d70 60% 100%)}
.pb.ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font:700 12px/1 "Pixelify Sans",sans-serif}
.pb.ic svg{display:block;width:22px;height:22px;fill:#3a2406}
.pb.wd{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:10px 16px;font:700 clamp(15px,1.2vw + 9px,20px)/1 "Pixelify Sans",sans-serif;letter-spacing:1px;color:#4a2c06;text-shadow:0 2px 0 #ffe9a0}
.pb.wd svg{display:block;flex:none;height:16px;width:auto;fill:#3a2406}
.pzo{position:fixed;inset:0;z-index:60;background:rgba(10,6,28,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.pzo[hidden]{display:none}
.pzp{width:min(400px,100%);max-height:100%;overflow:auto;background:#2e2742;border:4px solid #3a2406;box-shadow:inset 0 0 0 4px #f2b81c,inset 0 0 0 8px #3a2406;padding:24px 20px}
.pzt{font:400 clamp(16px,3vw,22px)/1.4 "Press Start 2P",monospace;color:#ffd84a;text-align:center;text-shadow:0 3px 0 #3a2406;margin:0 0 16px}
.pzl{display:grid;gap:12px}
.pzh{margin:0 0 14px}
body.pzon *{animation-play-state:paused!important}

/* ===== ajustes de visual: celular e computador ===== */
.board{container-type:size}
.tb{top:21%;right:2.5%;flex-direction:column;gap:6px}
.pb.ic{width:clamp(34px,10cqw,44px);height:clamp(34px,10cqw,44px)}
.pb.ic svg{width:52%;height:52%}
#top{left:4%;right:4%;font-size:clamp(9px,3.6cqw,22px);padding:2% 3%}
#top small{font-size:clamp(9px,2.5cqw,15px)}
.bsv{width:clamp(36px,21cqw,92px)}
.hi{width:clamp(11px,3.6cqw,19px)}
.bd{font-size:clamp(10px,3.1cqw,16px)}
.bhi{width:clamp(14px,4cqw,26px)}
#intro{font-size:clamp(12px,5cqw,28px)}
#hcn{font-size:clamp(7px,1.9cqw,10px)}
.ar{font-size:clamp(11px,3.4cqw,20px)}
.panel{justify-content:flex-start}
.panel>:first-child{margin-top:auto}
.panel>:last-child{margin-bottom:auto}
@media (max-width:520px){
 main{padding:6px}
 .panel{padding:10px;margin-top:8px;border-radius:14px}
 .bq{--s:2.5px}
 .bub .bt{font-size:15px}
 .who{margin:-12px 4px 2px 0}
 .bn{display:none}
 .av{height:34px}
 .opts{gap:7px;margin-top:2px}
 .btn.opt{padding:7px 9px;font-size:15px;border-width:3px;gap:8px}
 .lt{width:26px;height:26px;font-size:10px}
 .panel p.sm{margin-top:6px;font-size:13px}
 .pzp{padding:18px 14px}
}
@media (orientation:landscape) and (max-height:520px){
 main{padding:4px;gap:6px;grid-template-columns:42fr 58fr}
 .panel{padding:8px;border-radius:12px}
 .bq{--s:2px}
 .bub .bt{font-size:13px}
 .who{display:none}
 .opts{gap:5px;margin-top:0}
 .btn.opt{padding:5px 8px;font-size:13px;border-width:3px;gap:7px}
 .lt{width:22px;height:22px;font-size:8px}
 .panel p.sm{font-size:12px;margin-top:4px}
 .rt{font-size:10px;margin-bottom:4px}
 .rr{padding:4px 8px;font-size:13px}
 .btn{padding:8px}
 .pzp{padding:12px}
 .pzt{margin-bottom:10px}
 .pb.wd{min-height:38px;padding:6px 12px;font-size:14px}
}
@media (min-width:1200px){
 .bq{--s:5px}
 .bub .bt{font-size:clamp(20px,1.7vw,28px)}
 .btn.opt{font-size:clamp(18px,1.5vw,24px);padding:12px 14px;gap:14px}
 .lt{width:36px;height:36px;font-size:14px}
 .av{height:clamp(56px,6vw,90px)}
 .bn{font-size:12px;padding:9px 11px}
 .panel p.sm{font-size:17px}
 .opts{gap:12px}
}
.bsv{width:clamp(30px,17cqw,92px)}
.pgs{grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pg{padding:6px 8px;gap:8px;font-size:clamp(12px,1vw + 7px,16px)}
.pg b{font-size:10px;padding:5px 6px}
.panel .btn.alt{margin-top:8px}
@media (min-width:1000px){
 .pzp{width:min(520px,100%);padding:30px 26px}
 .pzt{font-size:28px;margin-bottom:22px}
 .pb.wd{min-height:62px;font-size:24px;gap:14px}
 .pb.wd svg{height:22px}
 .pzl{gap:16px}
}
.p.pad .bd::after{content:" 🎮";font-size:.85em}

.ino{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 28%,#3d3170,#150d33 70%);display:flex;padding:14px;overflow:auto}
.ino[hidden]{display:none}
.ipn{width:min(560px,100%);margin:auto;background:#2e2742;border:4px solid #3a2406;box-shadow:inset 0 0 0 4px #f2b81c,inset 0 0 0 8px #3a2406;padding:24px 20px;text-align:center}
.ij{position:relative;width:120px;height:108px;margin:24px auto 6px;animation:ijmp 1.2s ease-in-out infinite}
.ij img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);opacity:0}
.ij .f1{animation:ifr1 1.2s steps(1) infinite}
.ij .f2{animation:ifr2 1.2s steps(1) infinite}
.ij .f3{animation:ifr3 1.2s steps(1) infinite}
@keyframes ifr1{0%,19.99%{opacity:1}20%,79.99%{opacity:0}80%,100%{opacity:1}}
@keyframes ifr2{0%,19.99%{opacity:0}20%,44.99%{opacity:1}45%,64.99%{opacity:0}65%,79.99%{opacity:1}80%,100%{opacity:0}}
@keyframes ifr3{0%,44.99%{opacity:0}45%,64.99%{opacity:1}65%,100%{opacity:0}}
@keyframes ijmp{0%,19%{transform:translateY(0)}45%,55%{transform:translateY(-22px)}80%,100%{transform:translateY(0)}}
.it{font:400 clamp(13px,3.6vw,22px)/1.5 "Press Start 2P",monospace;color:#ffd84a;text-shadow:0 3px 0 #3a2406;margin:6px 0 14px}
.itx{font:600 clamp(14px,1vw + 9px,18px)/1.4 "Pixelify Sans",sans-serif;color:#fff;margin:0 0 10px}
.itx b{color:#ffe7a0}
.ibj{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px}
.ibj .th{height:112px;width:auto}
.ig{font:400 clamp(15px,4vw,24px)/1.3 "Press Start 2P",monospace;color:#ffd84a;text-shadow:0 3px 0 #3a2406}
@media (prefers-reduced-motion:reduce){.ij,.ij img{animation:none!important}.ij .f2{opacity:1}}
@media (min-width:1000px){.ipn{width:min(660px,100%);padding:30px 28px}.it{font-size:26px}.itx{font-size:20px}.ig{font-size:26px}.ibj .th{height:130px}}
@media (max-height:620px){.ipn{padding:14px 14px}.ij{height:90px;transform:scale(.85)}.ibj .th{height:84px}.itx{margin-bottom:6px}}
.ij{animation:none!important;margin-top:30px}
.ijm{position:absolute;inset:0;transition:transform .1s linear}
.ij img{animation:none!important;opacity:1!important;visibility:hidden}
.ij img.f1{visibility:visible}
#ijs{position:absolute;left:50%;bottom:-6px;width:60px;height:9px;margin-left:-30px;background:rgba(0,0,0,.4);border-radius:50%;filter:blur(2px);transition:transform .1s linear}
.pbr{display:flex;gap:10px;margin:12px 0}
.pb.cnt{flex:1;flex-direction:column;gap:4px;min-height:92px;padding:10px 6px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,6vw,40px);color:#3a2406}
.pb.cnt .gl{height:1em;fill:#3a2406}
.pb.cnt small{font:800 clamp(10px,2.4vw,13px)/1 "Pixelify Sans",sans-serif;letter-spacing:1px;color:#4a2c06;text-shadow:0 1px 0 #ffe9a0}
.panel .pb.wd{margin-top:2px}
/* ===== computador: jogo em cima, perguntas embaixo ===== */
@media (min-width:900px){
 html,body{height:100%}
 main{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;max-width:1040px;height:100vh;height:100dvh;padding:10px;gap:10px;margin:0 auto}
 .stage{grid-column:1;grid-row:1;aspect-ratio:auto;height:100%;min-height:0;width:100%}
 .panel{grid-column:1;grid-row:2;margin:0;display:block;overflow:auto;max-height:46dvh;padding:14px 22px}
 .panel>*{max-width:880px;margin-left:auto;margin-right:auto}
 .panel>:first-child{margin-top:0}.panel>:last-child{margin-bottom:0}
 .opts{grid-template-columns:1fr 1fr;gap:10px}
 .bq{--s:4px}
 .bub .bt{font-size:clamp(18px,1.5vw,24px)}
 .btn.opt{font-size:clamp(16px,1.25vw,21px);padding:9px 12px;gap:10px}
 .lt{width:32px;height:32px;font-size:13px}
 .who{margin:-14px 6px 6px 0}
 .av{height:clamp(44px,5vw,64px)}
 .panel p.sm{font-size:15px;margin-top:8px}
 .pbr{max-width:640px}
 .panel:has(>.bq){display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:end}
 .panel:has(>.bq)>*{max-width:none;margin-left:0;margin-right:0}
 .panel:has(>.bq)>.bq{grid-column:1;--s:3px}
 .panel:has(>.bq)>.who{grid-column:2;margin:0 0 4px;align-self:end}
 .panel:has(>.bq)>:not(.bq):not(.who){grid-column:1/-1}
 .panel:has(>.bq) .bn{display:none}
 .panel:has(>.bq) .btn.opt{padding:7px 10px;font-size:clamp(16px,1.2vw,20px)}
 .panel:has(>.bq) .opts{margin-top:0}
}
